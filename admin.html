<title>Lab Console — Admin</title>

<style>
:root{--bg:#05070a;--bg2:#080c12;--panel:#101820ee;--solid:#101820;--line:#1c2836;--text:#e8eef5;--mute:#8b9bb4;--cyan:#00e5ff;--pcb:#22c55e;--violet:#8b5cf6;--amber:#ff9100;--danger:#ff4d6d;--grid:rgba(0,229,255,.045);--glow:rgba(0,229,255,.28);--display:Rajdhani,Inter,sans-serif;--mono:"Share Tech Mono",ui-monospace,monospace}

a{color:var(--cyan);text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
.tech{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.display{font-family:var(--display)}
.glass{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line)}
.lab-grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
.led{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--pcb);box-shadow:0 0 10px var(--pcb);animation:blink 2.4s ease-in-out infinite;vertical-align:middle}

.caret{display:inline-block;width:.55ch;height:.85em;margin-left:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:caret 1s steps(1) infinite;vertical-align:-.08em}
.live{animation:voltage 1.8s ease-in-out infinite}
.scan-sweep{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.scan-sweep:after{content:"";position:absolute;left:0;right:0;height:28%;background:linear-gradient(to bottom,transparent,rgba(0,229,255,.22),transparent);animation:scan-sweep 5.8s ease-in-out infinite}
nav.top{position:fixed;top:12px;left:12px;right:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;max-width:1152px;margin:0 auto}
.nav-links{display:flex;flex-wrap:wrap;gap:4px}
.nav-links a,.nav-links button{background:none;border:0;cursor:pointer;color:var(--mute);font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:6px 10px}
.nav-links a:hover,.nav-links button:hover,.nav-links a.active{color:var(--cyan)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;cursor:pointer}
.logo-mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(0,229,255,.4);color:var(--cyan);font-family:var(--display)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--line);background:transparent;color:var(--text);font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn.p{background:var(--cyan);color:#05070a;border-color:var(--cyan)}
.chip{border:1px solid var(--line);padding:4px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.wrap{max-width:1152px;margin:0 auto;padding:0 20px}
section.block{padding:96px 0;position:relative}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.04em}
h1{font-size:clamp(36px,7vw,72px);line-height:.95;margin:8px 0}
h2{font-size:clamp(28px,5vw,48px);margin:8px 0 16px}
.hero{min-height:100vh;padding:120px 0 64px;position:relative;overflow:hidden}
.hero-grid{display:grid;gap:40px;align-items:center}
@media(min-width:960px){.hero-grid{grid-template-columns:1.05fr .95fr}}
.pcb{position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:#080c12cc;overflow:hidden}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:28px}
@media(min-width:640px){.meta{grid-template-columns:repeat(4,1fr)}}
.meta div{border:1px solid var(--line);padding:10px 12px}
.cards{display:grid;gap:12px}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}@media(min-width:960px){.cards.three{grid-template-columns:1fr 1fr 1fr}}
.card{border:1px solid var(--line);background:var(--solid);padding:0;overflow:hidden;display:flex;flex-direction:column}
.card .body{padding:16px}
.card img{width:100%;height:180px;object-fit:cover;background:#0b1220;display:block}
.stat{font-family:var(--display);font-size:36px;color:var(--cyan)}
.bar{height:4px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pcb),var(--cyan))}
.modal{position:fixed;inset:0;background:#05070acc;backdrop-filter:blur(10px);z-index:70;overflow:auto;padding:24px;display:none}
.modal.on{display:block}
.modal .box{max-width:860px;margin:24px auto;background:var(--solid);border:1px solid var(--line)}
.splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:32px}
.hidden{display:none !important}
.field{width:100%;margin:6px 0 14px;padding:10px;background:#05070a66;border:1px solid var(--line)}
aside.side{background:var(--bg2);border-right:1px solid var(--line);min-height:100vh;display:flex;flex-direction:column}
aside.side a,aside.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer}
aside.side a.on,aside.side button.on,aside.side a:hover{color:var(--cyan);background:rgba(0,229,255,.08)}
.admin{display:grid;min-height:100vh}
@media(min-width:960px){.admin{grid-template-columns:240px 1fr}}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#05070acc;position:sticky;top:0}
.float-lab{position:absolute;z-index:2;border:1px solid var(--line);background:#05070acc;padding:3px 8px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;animation:float-drift 7s ease-in-out infinite}
footer.ft{border-top:1px solid var(--line);background:var(--bg2);padding:40px 20px}
.msg{font-family:var(--mono);font-size:12px;color:var(--pcb)}.msg.bad{color:var(--danger)}
[data-theme="light"]{--bg:#eef3f8;--bg2:#e4ebf3;--panel:#ffffffee;--solid:#ffffff;--line:#c9d5e3;--text:#0c1520;--mute:#4a5d73;--cyan:#007f92;--pcb:#0d8a42;--violet:#5b37c7;--amber:#c05600;--danger:#c81e45;--grid:rgba(12,40,70,.05);--glow:rgba(0,127,146,.18)}
.theme-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;position:relative;overflow:hidden}
.theme-btn svg{position:absolute;width:16px;height:16px;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s}
.theme-btn .ico-sun{opacity:1;transform:none}.theme-btn .ico-moon{opacity:0;transform:rotate(90deg) scale(.4)}
[data-theme="light"] .theme-btn .ico-sun{opacity:0;transform:rotate(-90deg) scale(.4)}
[data-theme="light"] .theme-btn .ico-moon{opacity:1;transform:none}
.btn.p{color:var(--bg)}
.field{background:color-mix(in srgb,var(--bg) 40%,transparent)}
.topbar{background:color-mix(in srgb,var(--bg) 80%,transparent)}
#theme-wipe{position:fixed;inset:0;z-index:120;pointer-events:none;opacity:0}
#theme-wipe.go{opacity:1;animation:themeWipe .5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes themeWipe{from{clip-path:circle(0 at var(--x) var(--y))}to{clip-path:circle(150vmax at var(--x) var(--y))}}

.save-toast{position:fixed;bottom:20px;right:20px;z-index:80;padding:10px 14px;display:none}
.save-toast.on{display:block}
.topbar .btn{padding:8px 16px;font-size:12px}#save-btn{min-width:88px}
 body{padding:0}</style>
</head>

    <canvas id="login-scope" style="width:100%;height:48px;margin-top:16px;opacity:.75"></canvas>
    <p style="text-align:center;margin-top:16px"><a class="tech" href="index.html">← BACK TO PORTFOLIO</a></p>
  </form>
</div>
<div id="app" class="admin hidden">

    <button data-v="projects" onclick="page('projects')">Projects</button>
    <button data-v="achievements" onclick="page('achievements')">Achievements</button>
    <button data-v="skills" onclick="page('skills')">Skills</button>
    <button data-v="messages" onclick="page('messages')">Messages</button>
    <button data-v="settings" onclick="page('settings')">Settings</button>
    <button data-v="data" onclick="page('data')">Publish data</button>
    <button style="margin-top:auto;border-top:1px solid var(--line);color:var(--danger)" onclick="logout()">SIGN OUT</button>
  </aside>
  <div>
    <div class="topbar"><span class="tech" style="color:var(--pcb)"><span class="led"></span> SYSTEM ONLINE</span><span style="display:flex;align-items:center;gap:10px"><button class="theme-btn" type="button" aria-label="Toggle theme" onclick="toggleTheme(event)">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
    </button><button class="btn p" type="button" onclick="saveNow()" id="save-btn">SAVE</button><span class="tech" id="save-status">STORAGE READY</span><a class="tech" href="index.html">VIEW PORTFOLIO →</a></span></div>
    <main style="padding:24px" id="main"></main>
  </div>
</div>
<div class="modal" id="modal"></div>
<div class="glass save-toast" id="save-toast">SAVED ✓</div>

  const x=(ev&&ev.clientX)||innerWidth-48, y=(ev&&ev.clientY)||24;
  wipe.style.setProperty('--x',x+'px'); wipe.style.setProperty('--y',y+'px');

}

 document.getElementById('rst').onchange=e=>readF(e.target.files[0],d=>{if(!valid(d,true)){dn.textContent='Restore failed. Invalid backup file.';dn.className='msg bad';return}if(!confirm('Restore this backup?\n\nYour current portfolio data will be replaced.'))return;merge(d,PUB.concat(['messages']));dn.textContent='Restored. Reloading…';setTimeout(()=>location.reload(),300)},()=>{dn.textContent='Restore failed. Invalid backup file.';dn.className='msg bad'});}
 bindAutosave();
}

function bindAutosave(){
  const f=document.querySelector('#main form');
  if(!f||!f.elements||!f.elements.headline||f.dataset.bound==='1') return;
  f.dataset.bound='1';
  f.addEventListener('input',function(){
    harvestForms();
    clearTimeout(bindAutosave._t);
    bindAutosave._t=setTimeout(function(){ save({quiet:true}); }, 350);
  });
}
function feat(id){const p=DB.projects.find(x=>x.id===id);p.featured=!p.featured;save();page('projects')}
function delProj(id){if(!confirm('Delete this project module?'))return;DB.projects=DB.projects.filter(p=>p.id!==id);save();page('projects')}
function delAch(id){DB.achievements=DB.achievements.filter(a=>a.id!==id);save();page('achievements')}
function delSk(id){DB.skills=DB.skills.filter(s=>s.id!==id);save();page('skills')}
function delMsg(id){DB.messages=DB.messages.filter(m=>m.id!==id);save();page('messages')}
function addSk(e){e.preventDefault();const f=e.target;DB.skills.push({id:uid(),name:f.name.value,category:f.category.value,level:Number(f.level.value)||70,description:''});save();page('skills');return false}
function addAch(){const t=prompt('Title');if(!t)return;DB.achievements.push({id:uid(),title:t,organization:prompt('Organization')||'',date:prompt('Date YYYY-MM')||new Date().toISOString().slice(0,7),description:'',category:'Award',order:DB.achievements.length+1});save();page('achievements')}
function editProj(id){const x=id?(DB.projects||[]).find(p=>p.id===id):{title:'',description:'',category:'IoT',technologies:[],status:'Completed',liveUrl:'',githubUrl:'',demoUrl:''};
 const m=document.getElementById('modal');m.className='modal on';
 m.innerHTML=`<form class="box" style="padding:20px" onsubmit="return saveProj(event,'${id||''}')"><button type="button" class="btn" onclick="document.getElementById('modal').className='modal'">CANCEL</button>
 <p class="tech">TITLE</p><input class="field" name="title" value="${esc(x.title||'')}" required>
 <p class="tech">DESCRIPTION</p><textarea class="field" name="description" rows="3">${esc(x.description||'')}</textarea>
 <p class="tech">CATEGORY</p><input class="field" name="category" value="${esc(x.category||'IoT')}">
 <p class="tech">TECHNOLOGIES (comma)</p><input class="field" name="technologies" value="${esc((x.technologies||[]).join(', '))}">
 <p class="tech">STATUS</p><input class="field" name="status" value="${esc(x.status||'Completed')}">
 <p class="tech">LIVE URL</p><input class="field" name="liveUrl" value="${esc(x.liveUrl||'')}">
 <p class="tech">GITHUB URL</p><input class="field" name="githubUrl" value="${esc(x.githubUrl||'')}">
 <p class="tech">DEMO URL</p><input class="field" name="demoUrl" value="${esc(x.demoUrl||'')}">
 <button class="btn p">SAVE MODULE</button></form>`;
 const form=m.querySelector('form');
 if(form){ form.addEventListener('input',function(){ harvestForms(); clearTimeout(editProj._t); editProj._t=setTimeout(function(){ save({quiet:true}); },350); }); }
}
function val(f,k){const el=f.elements[k]; return el?el.value:'';}
function saveProj(e,id){e.preventDefault();const f=e.target,tech=val(f,'technologies').split(',').map(s=>s.trim()).filter(Boolean);
 const patch={title:val(f,'title'),description:val(f,'description'),category:val(f,'category')||'IoT',technologies:tech,status:val(f,'status')||'Completed',liveUrl:val(f,'liveUrl'),githubUrl:val(f,'githubUrl'),demoUrl:val(f,'demoUrl')};
 if(id){const i=DB.projects.findIndex(p=>p.id===id); if(i>=0) DB.projects[i]=Object.assign({},DB.projects[i],patch);}
 else DB.projects.push(Object.assign({id:uid(),fullDescription:patch.description,image:'',featured:false,date:new Date().toISOString().slice(0,7),order:(DB.projects||[]).length+1},patch));
 save();document.getElementById('modal').className='modal';page('projects');return false}
function saveSet(e){if(e&&e.preventDefault)e.preventDefault();const f=e.target;const g=k=>f.elements[k]?f.elements[k].value:'';DB.profile=Object.assign({},DB.profile,{name:g('name'),title:g('title'),branch:g('branch'),focus:g('focus'),location:g('location'),email:g('email'),phone:g('phone'),github:g('github'),linkedin:g('linkedin'),headline:g('headline'),bio:g('bio')});save();return false}
function reloadFile(){
  fetch(new URL('data.json',document.baseURI)).then(r=>r.ok?r.json():null).then(d=>{
    if(!d||!valid(d)){ pingSaved(false); alert('Could not read data.json'); return; }
    try{ localStorage.removeItem('ece_lab_dirty'); }catch(e){}
    DB=Object.assign({messages: DB.messages||[]}, seed());
    applyFile(d);
    save({stamp:false, quiet:true});
    try{ localStorage.removeItem('ece_lab_dirty'); }catch(e){}
    pingSaved(true);
    page('data');
    const n=document.getElementById('dn'); if(n){ n.textContent='Loaded data.json. Index will show this file.'; n.className='msg'; }
  }).catch(()=>alert('Could not read data.json'));
}
function dlPub(){download('data.json',pick(PUB));dn&& (dn.textContent='Downloaded data.json. Replace the repo file and push to publish.')}
function dlBak(){const p=pick(PUB.concat(['messages']));p.kind='electro-backup';p.exportedAt=new Date().toISOString();const d=new Date();download(`electro-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}-${String(d.getMinutes()).padStart(2,'0')}-${String(d.getSeconds()).padStart(2,'0')}.json`,p)}
function readF(file,ok,fail){if(!file){fail('Cancelled.');return}const r=new FileReader();r.onerror=()=>fail('Could not read file.');r.onload=()=>{try{ok(JSON.parse(String(r.result||'')))}catch(e){fail('Invalid JSON.')}};r.readAsText(file)}

function applyFile(d){
  if(!d||!valid(d)) return false;
  const keep=DB.messages||[];
  const c=strip(d);
  PUB.forEach(k=>{ if(c[k]!==undefined) DB[k]=c[k]; });
  DB.messages=keep;
  return true;
}
function applyLocal(){
  try{
    const r=localStorage.getItem(KEY);
    if(!r) return false;
    const parsed=JSON.parse(r);
    ['profile','settings','stats','projects','achievements','skills','messages'].forEach(k=>{ if(parsed[k]!==undefined) DB[k]=parsed[k]; });
    return true;
  }catch(e){ return false; }
}
function bootAdmin(){
  DB=Object.assign({messages:[]}, seed());
  const dirty=(()=>{try{return localStorage.getItem('ece_lab_dirty')==='1'}catch(e){return false}})();
  const finish=()=>{ if(dirty) applyLocal(); show(sessionStorage.getItem(AUTH)==='1'); };
  fetch(new URL('data.json', document.baseURI)).then(r=>r.ok?r.json():null).then(d=>{
    applyFile(d);
    finish();
  }).catch(finish);
}
bootAdmin();
